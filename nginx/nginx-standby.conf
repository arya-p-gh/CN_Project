# Team 07 - standby edge for Extension E (Mac 3, 10.7.30.100)
# Same as nginx-edge.conf, except:
#   - the upstreams are 127.0.0.1, because the backends run on this Mac
#     (this also keeps working with the pf rules, which allow lo0)
#   - X-Edge says mac3-standby, so you can tell which edge answered
#   - separate log/pid/cache paths
#
# Before use: sed -i '' "s|HOME_DIR|$HOME|g" ~/cn/nginx-standby.conf
# run:  nginx -t -c ~/cn/nginx-standby.conf && nginx -c ~/cn/nginx-standby.conf
# stop: nginx -s stop -c ~/cn/nginx-standby.conf

worker_processes 1;
error_log /tmp/cn-standby-error.log info;
pid       /tmp/cn-standby.pid;
events { worker_connections 1024; }

http {
    log_format edge '$remote_addr:$remote_port -> $upstream_addr [$status] cache=$upstream_cache_status';
    access_log /tmp/cn-standby-access.log edge;

    proxy_cache_path /tmp/cn-standby-cache levels=1:2 keys_zone=cncache:10m max_size=100m inactive=60s use_temp_path=off;

    upstream backends {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=10s;
    }

    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
    proxy_next_upstream   error timeout http_502 http_503;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team07.test api.team07.test;

        ssl_certificate     HOME_DIR/cn/tls/app.team07.test.crt;
        ssl_certificate_key HOME_DIR/cn/tls/app.team07.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /api/status {
            proxy_cache cncache;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Edge "mac3-standby" always;
            proxy_pass http://backends;
        }
        location / {
            add_header X-Edge "mac3-standby" always;
            proxy_pass http://backends;
        }
    }
}
