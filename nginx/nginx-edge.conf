# Team 07 - edge reverse proxy / load balancer (Mac 2, 10.7.20.12)
#
# Before use, replace HOME_DIR with the real home directory:
#   sed -i '' "s|HOME_DIR|$HOME|g" ~/cn/nginx-edge.conf
# run:    nginx -t -c ~/cn/nginx-edge.conf && nginx -c ~/cn/nginx-edge.conf
# reload: nginx -s reload -c ~/cn/nginx-edge.conf

worker_processes 1;
error_log /tmp/cn-nginx-error.log info;
pid       /tmp/cn-nginx.pid;
events { worker_connections 1024; }

http {
    # shows which backend served each request, and the cache result
    log_format edge '$remote_addr:$remote_port -> $upstream_addr [$status] cache=$upstream_cache_status';
    access_log /tmp/cn-nginx-access.log edge;

    proxy_cache_path /tmp/cn-nginx-cache levels=1:2 keys_zone=cncache:10m max_size=100m inactive=60s use_temp_path=off;

    # round robin across both backends on Mac 3
    # Ext D: one failed attempt marks a server down for 10 s
    upstream backends {
        server 10.7.30.100:3001 max_fails=1 fail_timeout=10s;
        server 10.7.30.100:3002 max_fails=1 fail_timeout=10s;
    }

    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
    proxy_next_upstream   error timeout http_502 http_503;   # retry the request on the other backend
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team07.test api.team07.test;

        ssl_certificate     HOME_DIR/cn/tls/app.team07.test.crt;
        ssl_certificate_key HOME_DIR/cn/tls/app.team07.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # cached endpoint (Task F)
        location = /api/status {
            proxy_cache cncache;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Edge "mac2-primary" always;
            proxy_pass http://backends;
        }

        # uncached, used for the load-balancing demo
        location / {
            add_header X-Edge "mac2-primary" always;
            proxy_pass http://backends;
        }
    }

    # plain HTTP, only used to compare captures
    server {
        listen 8080;
        server_name app.team07.test api.team07.test;
        location / {
            add_header X-Edge "mac2-primary" always;
            proxy_pass http://backends;
        }
    }
}
