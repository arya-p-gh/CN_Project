# Team 07 - backup DNS (Mac 3, 10.7.30.100)
# Same records as the primary. Only listen-address is different.
# run: sudo /opt/homebrew/sbin/dnsmasq -k -C ~/cn/dnsmasq.conf --log-facility=-

interface=en0
listen-address=127.0.0.1,10.7.30.100
bind-interfaces

local=/team07.test/
domain-needed
bogus-priv

no-resolv
server=1.1.1.1
server=8.8.8.8

host-record=app.team07.test,10.7.20.12,30
host-record=api.team07.test,10.7.20.12,30
local-ttl=30

log-queries
