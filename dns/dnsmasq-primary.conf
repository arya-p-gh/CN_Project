# Team 07 - primary DNS (Mac 1, 10.7.30.40)
# run: sudo /opt/homebrew/sbin/dnsmasq -k -C ~/cn/dnsmasq.conf --log-facility=-

interface=en0
listen-address=127.0.0.1,10.7.30.40
bind-interfaces

# answer team07.test ourselves, never forward it upstream
local=/team07.test/
domain-needed
bogus-priv

# everything else goes upstream (and we don't read /etc/resolv.conf,
# because this Mac uses itself as its DNS server and would loop)
no-resolv
server=1.1.1.1
server=8.8.8.8

# records -> edge (Mac 2), with a 30 s TTL for the Extension B / E demos
host-record=app.team07.test,10.7.20.12,30
host-record=api.team07.test,10.7.20.12,30
local-ttl=30

log-queries
